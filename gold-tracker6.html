<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costco Logistics & Bullion | NV-Dual</title>
    <style>
        :root { --nv-green: #76b900; --bg-black: #050505; --card-gray: #151515; --border: #333; }
        body { background: var(--bg-black); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        
        /* Two-Column Layout */
        .grid-container { 
            display: grid; 
            grid-template-columns: 1fr 1.5fr; 
            gap: 20px; 
            max-width: 1100px; 
            margin: 0 auto;
        }

        .stat-card { 
            background: var(--card-gray); padding: 20px; border-radius: 12px; 
            border: 1px solid var(--border); margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .title { color: var(--nv-green); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .value { font-size: 2.5rem; font-weight: 800; color: var(--nv-green); margin: 10px 0; }

        input { background: #000; border: 1px solid #444; color: white; padding: 12px; border-radius: 6px; width: calc(100% - 26px); margin-bottom: 10px; font-size: 1rem; }
        .btn { background: var(--nv-green); color: black; border: none; padding: 14px; border-radius: 6px; font-weight: 700; cursor: pointer; width: 100%; text-transform: uppercase; transition: 0.2s; }
        .btn:hover { background: #89d400; transform: scale(1.02); }

        .store-item { background: #111; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .store-item:hover { border-left-color: var(--nv-green); background: #1a1a1a; }
        .store-meta { flex: 1; }
        .action-btns { display: flex; flex-direction: column; gap: 5px; min-width: 100px; }
        
        .mini-btn { padding: 6px 10px; font-size: 0.65rem; border-radius: 4px; text-decoration: none; text-align: center; font-weight: bold; text-transform: uppercase; }
        .btn-maps { background: #333; color: white; }
        .btn-stock { background: var(--nv-green); color: black; }

        @media (max-width: 800px) { .grid-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="grid-container">
    <div class="column">
        <div class="stat-card">
            <div class="title">Gold Spot Price</div>
            <div id="gold-price" class="value">---.--</div>
            <div id="price-status" style="font-size:0.7rem; color:#666;">Syncing with live markets...</div>
        </div>

        <div class="stat-card">
            <div class="title">Costco Item Lookup</div>
            <button class="btn" style="background:#444; color:white; margin-bottom:10px;" onclick="window.open('https://www.costco.com/.product.1768080.html', '_blank')">1oz PAMP Gold</button>
            <button class="btn" style="background:#444; color:white;" onclick="window.open('https://www.costco.com/.product.1799327.html', '_blank')">1oz Silver Bar</button>
        </div>
    </div>

    <div class="column">
        <div class="stat-card">
            <div class="title">Warehouse Logistics Finder</div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="zip-input" placeholder="Zip Code (08003)">
                <button class="btn" style="width:120px;" onclick="findTop10Stores()">Search</button>
            </div>
            
            <div id="results-container" style="margin-top:20px;">
                <p style="color:#666; font-size:0.8rem;">Enter zip to analyze nearest hubs...</p>
            </div>
        </div>
    </div>
</div>

<script>
    let globalCostcos = [];

    async function loadStores() {
        try {
            // Using a high-reliability fallback list while fetching the global file
            const response = await fetch('https://raw.githubusercontent.com/ghandic/costco-warehouses/master/costco_warehouses.json');
            globalCostcos = await response.json();
            console.log("Global Warehouse DB Loaded.");
        } catch (e) { 
            console.error("DB Load Error"); 
            // Manual fallback for your key locations
            globalCostcos = [{city:"Cherry Hill", state:"NJ", address:"100 Centerton Rd", latitude:39.92, longitude:-75.02}];
        }
    }

    async function fetchGoldPrice() {
        try {
            const resp = await fetch('https://api.coinbase.com/v2/prices/XAU-USD/spot');
            const data = await resp.json();
            document.getElementById('gold-price').innerText = `$${parseFloat(data.data.amount).toLocaleString()}`;
            document.getElementById('price-status').innerText = `Last Sync: ${new Date().toLocaleTimeString()}`;
        } catch (e) { }
    }

    async function findTop10Stores() {
        const zip = document.getElementById('zip-input').value || "08003";
        const container = document.getElementById('results-container');
        container.innerHTML = "<p style='color:var(--nv-green)'>Calculating distances...</p>";

        try {
            const response = await fetch(`https://api.zippopotam.us/us/${zip}`);
            if (!response.ok) throw new Error("API Limit");
            const data = await response.json();
            const uLat = parseFloat(data.places[0].latitude);
            const uLng = parseFloat(data.places[0].longitude);

            const sorted = globalCostcos.map(store => {
                const dist = calculateDistance(uLat, uLng, parseFloat(store.latitude), parseFloat(store.longitude));
                return { ...store, dist };
            }).sort((a, b) => a.dist - b.dist).slice(0, 10);

            container.innerHTML = "";
            sorted.forEach(store => {
                const mapsUrl = `https://www.google.com/maps/search/Costco+${encodeURIComponent(store.address + ' ' + store.city)}`;
                const invUrl = `https://www.costco.com/warehouse-locations?search=${zip}`;

                container.innerHTML += `
                    <div class="store-item">
                        <div class="store-meta">
                            <div style="color:var(--nv-green); font-weight:bold;">${store.city}</div>
                            <div style="font-size:0.7rem; color:#888;">${store.address}</div>
                            <div style="font-size:0.75rem; margin-top:3px;">${store.dist.toFixed(1)} miles</div>
                        </div>
                        <div class="action-btns">
                            <a href="${mapsUrl}" target="_blank" class="mini-btn btn-maps">Maps</a>
                            <a href="${invUrl}" target="_blank" class="mini-btn btn-stock">Stock</a>
                        </div>
                    </div>
                `;
            });
        } catch (e) {
            container.innerHTML = "<p style='color:red'>Zip service busy. Try again in 5s.</p>";
        }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 3958.8;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    fetchGoldPrice();
    loadStores();
    setInterval(fetchGoldPrice, 30000);
</script>
</body>
</html>
