<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>National Pi Lab | Elite Competition Suite</title>
    <style>
        :root {
            --judge-blue: #002347;
            --data-teal: #00f5d4;
            --pi-gold: #ffb703;
            --alert-red: #ff4d4d;
            --bg: #f8f9fa;
        }

        body { margin: 0; background: var(--bg); color: #333; font-family: 'Inter', sans-serif; display: flex; overflow-x: hidden; }

        /* Sidebar Navigation */
        #sidebar { 
            width: 350px; height: 100vh; background: var(--judge-blue); 
            color: white; padding: 20px; box-sizing: border-box; 
            position: fixed; overflow-y: auto; border-right: 4px solid var(--pi-gold);
            z-index: 1000;
        }

        .module-card {
            background: rgba(255,255,255,0.05); border-radius: 8px;
            padding: 15px; margin-bottom: 20px; border-left: 3px solid var(--data-teal);
        }

        h2, h4 { color: var(--pi-gold); text-transform: uppercase; margin-top: 0; letter-spacing: 1px; }
        
        #timer-display { font-family: 'Courier New', monospace; font-size: 3rem; color: var(--data-teal); text-align: center; display: block; margin: 5px 0; }

        .stat-box { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; color: var(--alert-red); border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; margin-top: 10px; }

        .btn { 
            width: 100%; padding: 12px; margin: 5px 0; border-radius: 4px; border: none;
            font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase;
        }
        .btn-start { background: var(--data-teal); color: var(--judge-blue); }
        .btn-zen { background: #9c27b0; color: white; }
        .btn-audio { background: #ff5722; color: white; }
        .btn-method { background: #334e68; color: white; font-size: 0.75rem; }
        .btn-method:hover { background: var(--pi-gold); color: black; }

        /* Main Lab Viewport */
        #viewport { margin-left: 350px; padding: 40px; width: 100%; box-sizing: border-box; }
        
        .method-desc { 
            background: #fff; padding: 20px; border-radius: 8px; 
            margin-bottom: 30px; border: 1px solid #ddd; display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }

        /* Card Interaction Styling */
        .card { 
            background: white; border: 1px solid #ccc; height: 120px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 8px; transition: 0.3s; cursor: pointer; position: relative;
        }
        .card:hover { border-color: var(--pi-gold); background: #fffdf5; }
        .card.active-target { border: 3px solid var(--data-teal); box-shadow: 0 0 20px rgba(0,245,212,0.4); transform: scale(1.05); z-index: 10; }
        .card.revealed { background: #e0fffb; border-color: var(--data-teal); }
        .card.zen-focus { border-color: #9c27b0; box-shadow: 0 0 15px #9c27b0; }
        .card.error-blink { animation: blink 0.4s 2; border-color: var(--alert-red); }

        @keyframes blink { 50% { background: var(--alert-red); color: white; } }
        
        .card-idx { font-size: 0.7rem; color: #888; position: absolute; top: 8px; left: 8px; font-weight: bold; }
        .card-val { font-weight: 900; font-size: 1.6rem; color: #eee; transition: 0.2s; }
        .revealed .card-val { color: var(--judge-blue); }

        .score-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #2d4a6a; font-size: 0.85rem; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>PI NATIONAL LAB</h2>
    
    <div class="module-card">
        <h4>Competition Clock</h4>
        <span id="timer-display">0.00</span>
        <div class="stat-box">
            <span>MISTAKES:</span>
            <span id="mistake-count">0</span>
        </div>
        <button class="btn btn-start" onclick="startRandomTest()">Random Recall Test</button>
        <button class="btn btn-zen" id="zen-toggle" onclick="toggleZenMode()">Enable Zen Mode</button>
        <button class="btn btn-audio" onclick="speakCurrentCard()">Speak Block (Audio)</button>
    </div>

    <div class="module-card">
        <h4>Methodology Hub</h4>
        <button class="btn btn-method" onclick="showMethod('chunking')">Chunking (3-Digit Blocks)</button>
        <button class="btn btn-method" onclick="showMethod('palace')">The Memory Palace</button>
        <button class="btn btn-method" onclick="showMethod('major')">Major Phonetic System</button>
        <button class="btn btn-method" onclick="showMethod('pao')">P.A.O. (Person-Action-Object)</button>
    </div>

    <div class="module-card">
        <h4>High Score Records</h4>
        <div id="score-list"><div style="text-align: center; opacity: 0.5;">No records yet</div></div>
    </div>
    
    <button class="btn btn-method" onclick="resetGrid()" style="margin-top: 20px; opacity: 0.6;">Reset Lab View</button>
</div>

<div id="viewport">
    <div id="method-box" class="method-desc"></div>
    <div class="grid" id="pi-grid"></div>
</div>

<script>
    const piData = ["314", "159", "265", "358", "979", "323", "846", "264", "338", "327", "950", "288", "419", "716", "939", "937", "510", "582", "097", "494", "459", "230", "781", "640", "628", "620", "067", "982", "148", "086", "513", "282", "306", "647", "093", "844", "609", "550", "582", "231", "725", "359", "408", "128", "481", "117", "450", "284", "102", "701", "938", "521"];
    let timer, startTime, activeIdx = null;
    let zenInterval = null;
    let mistakes = 0;
    let scores = JSON.parse(localStorage.getItem('pi_lab_scores')) || [];

    function init() {
        const grid = document.getElementById('pi-grid');
        piData.forEach((val, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${i}`;
            card.innerHTML = `<div class="card-idx">#${i+1}</div><div class="card-val">${val}</div>`;
            card.onclick = () => handleCardInteraction(i);
            grid.appendChild(card);
        });
        updateScoreBoard();
    }

    function handleCardInteraction(i) {
        const card = document.getElementById(`card-${i}`);
        
        // Competition Mode Logic
        if (activeIdx !== null) {
            if (i === activeIdx) {
                clearInterval(timer);
                card.classList.add('revealed');
                const timeStr = document.getElementById('timer-display').innerText;
                saveScore(timeStr);
                activeIdx = null;
            } else {
                mistakes++;
                document.getElementById('mistake-count').innerText = mistakes;
                card.classList.add('error-blink');
                setTimeout(() => card.classList.remove('error-blink'), 800);
            }
        } else {
            // Study Mode
            card.classList.toggle('revealed');
        }
    }

    function startRandomTest() {
        stopZenMode();
        resetGrid();
        mistakes = 0;
        document.getElementById('mistake-count').innerText = "0";
        activeIdx = Math.floor(Math.random() * 52);
        const target = document.getElementById(`card-${activeIdx}`);
        target.classList.add('active-target');
        target.scrollIntoView({behavior: 'smooth', block: 'center'});
        
        startTime = Date.now();
        timer = setInterval(() => {
            document.getElementById('timer-display').innerText = ((Date.now() - startTime)/1000).toFixed(2);
        }, 10);
    }

    function toggleZenMode() { zenInterval ? stopZenMode() : startZenMode(); }

    function startZenMode() {
        resetGrid();
        let currentZenIdx = 0;
        document.getElementById('zen-toggle').innerText = "Stop Zen Mode";
        document.getElementById('zen-toggle').style.background = "#e91e63";

        zenInterval = setInterval(() => {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('zen-focus', 'revealed'));
            if (currentZenIdx >= 52) { stopZenMode(); return; }
            const card = document.getElementById(`card-${currentZenIdx}`);
            card.classList.add('zen-focus');
            card.scrollIntoView({behavior: 'smooth', block: 'center'});
            setTimeout(() => card.classList.add('revealed'), 2000);
            currentZenIdx++;
        }, 4000);
    }

    function stopZenMode() {
        clearInterval(zenInterval);
        zenInterval = null;
        document.getElementById('zen-toggle').innerText = "Enable Zen Mode";
        document.getElementById('zen-toggle').style.background = "#9c27b0";
    }

    function speakCurrentCard() {
        if (activeIdx === null) return alert("Start a test first!");
        const msg = new SpeechSynthesisUtterance(`Block ${activeIdx + 1} is: ${piData[activeIdx].split('').join(' ')}`);
        window.speechSynthesis.speak(msg);
    }

    function saveScore(time) {
        scores.push(parseFloat(time));
        scores.sort((a, b) => a - b);
        scores = scores.slice(0, 5);
        localStorage.setItem('pi_lab_scores', JSON.stringify(scores));
        updateScoreBoard();
    }

    function updateScoreBoard() {
        const list = document.getElementById('score-list');
        if (scores.length === 0) return;
        list.innerHTML = scores.map((s, i) => `<div class="score-row"><span>RANK ${i+1}</span><span style="color:var(--data-teal)">${s.toFixed(2)}s</span></div>`).join('');
    }

    function showMethod(m) {
        const methods = {
            chunking: "<strong>CHUNKING:</strong> Grouping 3-digit blocks to reduce cognitive load.",
            palace: "<strong>MEMORY PALACE:</strong> Visualizing digits in a familiar room.",
            major: "<strong>MAJOR SYSTEM:</strong> Converting digits into consonant sounds/words.",
            pao: "<strong>P.A.O.:</strong> Creating a Person-Action-Object story for every 6 digits."
        };
        const box = document.getElementById('method-box');
        box.innerHTML = methods[m];
        box.style.display = 'block';
    }

    function resetGrid() {
        clearInterval(timer);
        activeIdx = null;
        document.getElementById('timer-display').innerText = "0.00";
        document.querySelectorAll('.card').forEach(c => c.classList.remove('revealed', 'active-target', 'zen-focus'));
    }

    init();
</script>
</body>
</html>
