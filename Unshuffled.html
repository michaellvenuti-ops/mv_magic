<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Faro Mechanics Lab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #0a0a0a; color: white; font-family: sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 100; background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid #444; border-radius: 8px; width: 250px; }
        button { width: 100%; margin: 5px 0; padding: 10px; cursor: pointer; background: #222; color: #ffb703; border: 1px solid #ffb703; font-weight: bold; }
        button:hover { background: #ffb703; color: black; }
        .info { font-size: 0.8rem; color: #ccc; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="ui">
    <h3>3D Faro Lab</h3>
    <div class="info">Drag to rotate. Scroll to zoom.</div>
    <button onclick="demonstrateFaro('OUT')">Animate Faro OUT</button>
    <button onclick="demonstrateFaro('IN')">Animate Faro IN</button>
    <button onclick="resetDeck()" style="border-color: #666; color: #999;">Reset Stack</button>
    <div id="status" style="margin-top:10px; font-family:monospace; color:#00f5d4;">Ready</div>
</div>

<script>
    let scene, camera, renderer, cards = [];
    const CARD_W = 2.5, CARD_H = 0.04, CARD_D = 3.5;
    const GAP = 0.01;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const light = new THREE.PointLight(0xffffff, 0.5);
        light.position.set(10, 10, 10);
        scene.add(light);

        camera.position.set(8, 5, 8);
        camera.lookAt(0, 0, 0);

        createCards();
        animate();
    }

    function createCards() {
        const loader = new THREE.TextureLoader();
        for (let i = 0; i < 52; i++) {
            const geometry = new THREE.BoxGeometry(CARD_W, CARD_H, CARD_D);
            const materials = [
                new THREE.MeshStandardMaterial({color: 0xffffff}), // edges
                new THREE.MeshStandardMaterial({color: 0xffffff}),
                new THREE.MeshStandardMaterial({color: 0xffffff}),
                new THREE.MeshStandardMaterial({color: 0xffffff}),
                new THREE.MeshStandardMaterial({color: 0xf0f0f0}), // face
                new THREE.MeshStandardMaterial({color: i < 26 ? 0xd90429 : 0x1a1a1a}) // back (Red for top half, Black for bottom)
            ];
            
            const card = new THREE.Mesh(geometry, materials);
            card.position.y = (i * (CARD_H + GAP)) - (52 * (CARD_H + GAP) / 2);
            card.userData = { id: i };
            scene.add(card);
            cards.push(card);
        }
    }

    async function demonstrateFaro(type) {
        document.getElementById('status').innerText = "Splitting...";
        
        // 1. Split the deck visually
        for(let i=0; i<52; i++) {
            const targetX = (i < 26) ? -2 : 2; // Top half moves left, bottom moves right
            cards[i].position.x = targetX;
        }
        await new Promise(r => setTimeout(r, 800));

        document.getElementById('status').innerText = "Interweaving...";
        
        // 2. Perform the weave
        let topHalf = cards.slice(0, 26);
        let botHalf = cards.slice(26, 52);
        let newOrder = [];

        for(let i=0; i<26; i++) {
            if(type === 'OUT') {
                newOrder.push(topHalf[i]);
                newOrder.push(botHalf[i]);
            } else {
                newOrder.push(botHalf[i]);
                newOrder.push(topHalf[i]);
            }
        }

        // 3. Move to new positions
        newOrder.forEach((card, idx) => {
            card.position.x = 0;
            card.position.y = (idx * (CARD_H + GAP)) - (52 * (CARD_H + GAP) / 2);
        });

        cards = newOrder;
        document.getElementById('status').innerText = `Completed Faro ${type}`;
    }

    function resetDeck() {
        cards.sort((a, b) => a.userData.id - b.userData.id);
        cards.forEach((card, i) => {
            card.position.set(0, (i * (CARD_H + GAP)) - (52 * (CARD_H + GAP) / 2), 0);
        });
        document.getElementById('status').innerText = "Stack Reset";
    }

    // Interaction
    let isDragging = false;
    document.addEventListener('mousedown', () => isDragging = true);
    document.addEventListener('mouseup', () => isDragging = false);
    document.addEventListener('mousemove', (e) => {
        if(isDragging) {
            scene.rotation.y += e.movementX * 0.01;
            scene.rotation.x += e.movementY * 0.01;
        }
    });

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
