<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteamLIT Examples</title>
    
    <style>
        :root {
            --primary: #e63946;
            --dark: #0b132b;
            --card-bg: #1c2541;
            --text-light: #f1faee;
            --gold: #ffb703;
            --accent: #a8dadc;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--dark); 
            color: var(--text-light); 
            margin: 0; 
            line-height: 1.6; 
        }
        
        header { 
            background: linear-gradient(rgba(11, 19, 43, 0.9), rgba(11, 19, 43, 0.9)), 
                        url('https://images.unsplash.com/photo-1523031159170-982460773d74?auto=format&fit=crop&q=80&w=1200'); 
            background-size: cover; 
            padding: 80px 20px; 
            text-align: center; 
            border-bottom: 4px solid var(--gold); 
        }
        
        header h1 { 
            font-size: 3.5rem; 
            margin: 0; 
            color: var(--gold); 
            text-transform: uppercase; 
            letter-spacing: 8px; 
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .container { max-width: 1100px; margin: -50px auto 100px auto; padding: 20px; }
        
        .nav-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 30px; 
        }

        /* NAVIGATION CARD STYLING */
        .portal-card { 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 15px; 
            border: 1px solid #3a506b; 
            text-align: center;
            transition: all 0.4s ease;
            text-decoration: none;
            color: inherit;
            display: block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .portal-card:hover { 
            transform: translateY(-10px); 
            border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(230, 57, 70, 0.3);
        }

        .portal-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: 0.5s;
        }

        .portal-card:hover::before { left: 100%; }

        .portal-card i { 
            font-size: 3rem; 
            color: var(--primary); 
            margin-bottom: 20px; 
            display: block;
        }

        .portal-card h2 { 
            color: var(--gold); 
            margin-bottom: 15px; 
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .portal-card p { font-size: 0.95rem; color: var(--accent); }

        .btn-visit {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background: var(--primary);
            color: white;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* SYSTEM STATUS BAR */
        .status-bar {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            margin-top: 50px;
            border: 1px solid #0f0;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.2);
        }

        .status-dot {
            height: 10px; width: 10px;
            background-color: #0f0;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
 
        <a href="https://mvmagic-nf97nkxvycudytltfwavf7.streamlit.app/" class="portal-card">
            <h2>My First Web App Using Steamlit</h2>
            <p>Visual Video to Searchable PDF Lab (Manual Review)</p>
            <span class="btn-visit">Enter the App</span>
        </a>
