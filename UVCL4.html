<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Virtual Card Lab v5.0 - Persistent State</title>
    <style>
        /* ... [Existing Styles from v4.0] ... */
        :root { --gold: #ffb703; --accent: #d90429; }
        .save-btn { background: var(--gold) !important; color: black !important; border: none !important; }
        .save-btn:hover { background: #fff !important; }
    </style>
</head>
<body>
    <div class="controls">
        <button class="save-btn" onclick="saveStackManual()">Save Snapshot</button>
        <button onclick="loadSavedStack()">Restore Saved State</button>
    </div>

<script>
    // --- PERSISTENCE LOGIC ---
    function saveStackManual() {
        localStorage.setItem('lab_custom_stack', JSON.stringify(deck));
        logMove("Snapshot saved to browser memory.");
        alert("Stack saved successfully!");
    }

    function loadSavedStack() {
        let saved = localStorage.getItem('lab_custom_stack');
        if (saved) {
            deck = JSON.parse(saved);
            logMove("Snapshot restored.");
            renderDeck();
        } else {
            alert("No saved stack found.");
        }
    }

    // Auto-save on every move
    function logMove(msg) {
        localStorage.setItem('lab_custom_stack', JSON.stringify(deck)); // Auto-sync
        const log = document.getElementById('history');
        const entry = document.createElement('div');
        entry.className = 'history-entry';
        entry.innerText = `> ${msg}`;
        log.prepend(entry);
    }
    
    // Update window.onload to try restoring previous session first
    window.onload = () => {
        let saved = localStorage.getItem('lab_custom_stack');
        if(saved) {
            deck = JSON.parse(saved);
            renderDeck();
            logMove("Restored session from last time.");
        } else {
            resetTo('NDO');
        }
    };
</script>
</body>
</html>
