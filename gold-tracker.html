<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costco Gold Tracker | Dashboard</title>
    <style>
        /* NVIDIA-Inspired Dark Mode Aesthetic */
        :root {
            --nvidia-green: #76b900;
            --bg-dark: #000000;
            --card-bg: #1a1a1a;
            --text-gray: #b3b3b3;
            --text-light: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .dashboard {
            width: 90%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            border-top: 4px solid var(--nvidia-green);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .stat-card {
            background: #252525;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .label {
            color: var(--text-gray);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .value {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--nvidia-green);
        }

        .btn {
            background-color: var(--nvidia-green);
            color: black;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: transform 0.2s, background 0.2s;
        }

        .btn:hover {
            background-color: #89d400;
            transform: translateY(-2px);
        }

        .status-msg {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-gray);
        }
    </style>
</head>
<body>

<div class="dashboard">
    <h1>Asset Monitor</h1>
    
    <div class="stat-card">
        <div class="label">Live Gold Spot (USD/oz)</div>
        <div id="gold-price" class="value">---.--</div>
    </div>

    <div class="stat-card">
        <div class="label">Costco Item #1768080</div>
        <div id="stock-status" style="font-size: 1.2rem; margin-bottom: 10px;">Status: Unknown</div>
        <button class="btn" onclick="checkStock()">CHECK COSTCO STOCK</button>
    </div>

    <div class="status-msg" id="last-updated">
        Initializing secure data link...
    </div>
</div>

<script>
    // 1. Fetch Gold Price using a public proxy to avoid API key exposure
    async function fetchGoldPrice() {
        const priceElement = document.getElementById('gold-price');
        try {
            // Using a public price feed for demo; in production, you'd use your GoldAPI key
            const response = await fetch('https://api.coinbase.com/v2/prices/XAU-USD/spot');
            const data = await response.json();
            const price = parseFloat(data.data.amount).toLocaleString(undefined, {minimumFractionDigits: 2});
            priceElement.innerText = `$${price}`;
            document.getElementById('last-updated').innerText = `Last Market Sync: ${new Date().toLocaleTimeString()}`;
        } catch (error) {
            priceElement.innerText = "ERROR";
            console.error("Price fetch failed", error);
        }
    }

    // 2. Check Stock Function
    function checkStock() {
        const statusDisplay = document.getElementById('stock-status');
        statusDisplay.innerText = "Status: Redirecting to Warehouse...";
        
        // Because Costco blocks 'fetch' from GitHub Pages browsers, 
        // we open the product page in a new tab for a manual check.
        // Item #1768080 is the 1 oz Gold Bar PAMP Suisse
        setTimeout(() => {
            window.open('https://www.costco.com/.product.1768080.html', '_blank');
            statusDisplay.innerText = "Status: Verified in Browser";
        }, 800);
    }

    // Auto-refresh price every 60 seconds
    fetchGoldPrice();
    setInterval(fetchGoldPrice, 60000);
</script>

</body>
</html>
