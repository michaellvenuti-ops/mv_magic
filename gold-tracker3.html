<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costco Asset Tracker | V2</title>
    <style>
        :root { --nvidia-green: #76b900; --bg-dark: #000000; --card-bg: #1a1a1a; --text-gray: #b3b3b3; --text-light: #ffffff; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .dashboard { width: 100%; max-width: 500px; background: var(--card-bg); padding: 2rem; border-radius: 12px; border-top: 4px solid var(--nvidia-green); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 1.3rem; text-align: center; letter-spacing: 1px; margin-bottom: 1.5rem; color: var(--nvidia-green); }
        .stat-card { background: #252525; padding: 1.2rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid #333; }
        .label { color: var(--text-gray); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 5px; }
        .value { font-size: 1.8rem; font-weight: bold; color: var(--nvidia-green); }
        input { background: #000; border: 1px solid #444; color: white; padding: 10px; border-radius: 4px; width: calc(100% - 22px); margin-bottom: 10px; font-size: 1rem; }
        .btn { background-color: var(--nvidia-green); color: black; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn:hover { background-color: #89d400; }
        #nearest-result { margin-top: 10px; font-size: 0.9rem; color: #fff; }
    </style>
</head>
<body>

<div class="dashboard">
    <h1>Costco Precious Metals Monitor</h1>
    
    <div class="stat-card">
        <div class="label">Gold Spot (USD/oz)</div>
        <div id="gold-price" class="value">Loading...</div>
    </div>

    <div class="stat-card">
        <div class="label">Find Nearest Warehouse</div>
        <input type="text" id="zip-input" placeholder="Enter Zip Code (e.g. 08003)">
        <button class="btn" onclick="findNearestCostco()">LOCATE STORE</button>
        <div id="nearest-result"></div>
    </div>

    <div class="stat-card">
        <div class="label">Inventory Check</div>
        <button class="btn" style="background:#444; color:white;" onclick="window.open('https://www.costco.com/.product.1768080.html', '_blank')">OPEN ITEM #1768080</button>
    </div>
</div>

<script>
    let globalCostcos = [];

    // 1. Fetch the REAL list of Costcos from a public data source
    async function loadGlobalCostcos() {
        const resultDiv = document.getElementById('nearest-result');
        try {
            // Fetching a comprehensive Costco locations JSON
            const response = await fetch('https://raw.githubusercontent.com/get-community/costco-locations/main/costco-locations.json');
            const data = await response.json();
            
            // Map the data into a simple format our app understands
            globalCostcos = data.map(store => ({
                name: `${store.city}, ${store.state || store.country}`,
                lat: parseFloat(store.latitude),
                lng: parseFloat(store.longitude),
                address: store.address
            }));

            console.log(`Loaded ${globalCostcos.length} global warehouses.`);
        } catch (e) {
            console.error("Failed to load global list, using backups.");
            // Backup list in case the external data fails
            globalCostcos = [{ name: "Cherry Hill, NJ", lat: 39.926, lng: -75.025 }];
        }
    }

    async function fetchGoldPrice() {
        try {
            const resp = await fetch('https://api.coinbase.com/v2/prices/XAU-USD/spot');
            const data = await resp.json();
            document.getElementById('gold-price').innerText = `$${parseFloat(data.data.amount).toLocaleString()}`;
        } catch (e) { document.getElementById('gold-price').innerText = "OFFLINE"; }
    }

    async function findNearestCostco() {
        const zip = document.getElementById('zip-input').value;
        const resultDiv = document.getElementById('nearest-result');
        if (!zip) return;

        resultDiv.innerText = "Analyzing global network...";

        try {
            const response = await fetch(`https://api.zippopotam.us/us/${zip}`);
            if (!response.ok) throw new Error("Invalid Zip");
            const data = await response.json();
            const userLat = parseFloat(data.places[0].latitude);
            const userLng = parseFloat(data.places[0].longitude);

            let closest = null;
            let minDistance = Infinity;

            globalCostcos.forEach(store => {
                const dist = calculateDistance(userLat, userLng, store.lat, store.lng);
                if (dist < minDistance) {
                    minDistance = dist;
                    closest = store;
                }
            });

            resultDiv.innerHTML = `
                <div style="border-top: 1px solid #333; margin-top:10px; padding-top:10px;">
                    <strong>Closest Warehouse:</strong><br>
                    <span style="color:var(--nvidia-green)">${closest.name}</span><br>
                    <small style="color:var(--text-gray)">${closest.address}</small><br>
                    <strong>Distance:</strong> ${minDistance.toFixed(1)} miles
                </div>`;
        } catch (e) {
            resultDiv.innerText = "Location not found. Check zip code.";
        }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 3958.8; // Miles
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    // Initialize the app
    fetchGoldPrice();
    loadGlobalCostcos();
</script>

</body>
</html>
