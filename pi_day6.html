<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>National Pi Lab | Hall of Fame</title>
    <style>
        :root {
            --judge-blue: #002347; --data-teal: #00f5d4; --pi-gold: #ffb703;
            --alert-red: #ff4d4d; --major-orange: #fb8500; --pao-green: #2ec4b6; --bg: #f8f9fa;
        }
        body { margin: 0; background: var(--bg); color: #333; font-family: 'Inter', sans-serif; display: flex; }
        
        #sidebar { 
            width: 380px; height: 100vh; background: var(--judge-blue); color: white; padding: 20px; 
            box-sizing: border-box; position: fixed; overflow-y: auto; border-right: 4px solid var(--pi-gold); z-index: 1000;
        }
        .module-card { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 15px; margin-bottom: 15px; border-left: 3px solid var(--data-teal); }
        h2, h4 { color: var(--pi-gold); text-transform: uppercase; margin: 0 0 10px 0; letter-spacing: 1px; }
        
        #record-tracker { font-size: 0.8rem; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px; border: 1px solid var(--pi-gold); }
        .progress-bg { background: #444; height: 10px; border-radius: 5px; margin-top: 5px; }
        #progress-fill { background: var(--pi-gold); height: 100%; width: 0%; border-radius: 5px; transition: 0.5s; }

        .btn { width: 100%; padding: 10px; margin: 4px 0; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; font-size: 0.7rem; }
        .btn-method { background: #334e68; color: white; }

        #viewport { margin-left: 380px; padding: 40px; width: 100%; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .card { background: white; border: 1px solid #ccc; height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; position: relative; transition: 0.2s; }
        .card.active-target { border: 3px solid var(--data-teal) !important; transform: scale(1.05); }
        .card.revealed { background: #e0fffb; border-color: var(--data-teal); }
        
        .major-label { position: absolute; right: 5px; bottom: 5px; font-size: 0.6rem; font-weight: bold; color: var(--major-orange); text-transform: uppercase; display: none; }
        .card.major-focus .major-label { display: block; }

        .card-val { font-weight: 900; font-size: 1.5rem; color: #eee; transition: 0.3s; pointer-events: none; }
        .revealed .card-val { color: var(--judge-blue) !important; opacity: 1 !important; }

        #method-box { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; color: #333; display: none; border: 3px solid var(--pi-gold); }
        .stop-btn { background: var(--alert-red); color: white; padding: 5px; border-radius: 3px; cursor: pointer; float: right; font-size: 0.6rem; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>PI NATIONAL LAB</h2>

    <div class="module-card" id="record-tracker">
        <h4>Championship Tracker</h4>
        Current Goal: <strong>156 Digits</strong> (52 Cards)<br>
        <div class="progress-bg"><div id="progress-fill"></div></div>
        <p style="font-size: 0.65rem; margin-top: 8px; opacity: 0.8;">The regional record is 52 cards. Master this grid to become a local legend.</p>
    </div>

    <div class="module-card">
        <h4>Methodology Hub (Full 52)</h4>
        <button class="btn btn-method" onclick="runDemo('chunking')">Full Chunking Demo</button>
        <button class="btn btn-method" onclick="runDemo('palace')">Full Palace Tour</button>
        <button class="btn btn-method" style="background:var(--major-orange)" onclick="runDemo('major')">Full Major System</button>
        <button class="btn btn-method" style="background:var(--pao-green)" onclick="runDemo('pao')">Full P.A.O. Movie</button>
    </div>

    <div class="module-card">
        <h4>Trainer Tools</h4>
        <button class="btn" style="background:var(--data-teal); color:black;" onclick="startChampionshipRun()">Visual 52-Run</button>
        <button class="btn" style="background:#795548; color:white;" onclick="speakCurrentCard()">Speak Block (Audio)</button>
        <button class="btn" style="background:#9c27b0; color:white;" id="zen-toggle" onclick="toggleZenMode()">Enable Zen Mode</button>
        <button class="btn" style="background:#334e68; color:white;" onclick="resetGrid()">Reset Lab View</button>
    </div>
</div>

<div id="viewport">
    <div id="method-box"></div>
    <div class="grid" id="pi-grid"></div>
</div>

<script>
    const piData = ["314", "159", "265", "358", "979", "323", "846", "264", "338", "327", "950", "288", "419", "716", "939", "937", "510", "582", "097", "494", "459", "230", "781", "640", "628", "620", "067", "982", "148", "086", "513", "282", "306", "647", "093", "844", "609", "550", "582", "231", "725", "359", "408", "128", "481", "117", "450", "284", "102", "701", "938", "521"];
    
    // Generating Major Words for all 52 (Partial list shown, logic supports all)
    const majorWords = ["METEOR", "TULIP", "ANGEL", "MOVIE", "TEACUP", "MNM", "FRIDGE", "NINJA", "MUMMY", "MONKEY", "BLAZE", "FAN", "RAM", "CAGE", "BEAM", "HOOK", "LIGHT", "DOVE", "BOX", "BEAR", "LEAF", "NOSE", "FOOT", "CHAIR", "SHIP", "CHESS", "DICE", "BONE", "DOOR", "FISH", "PLUM", "FAN", "MOUSE", "SHARK", "BEE", "FIRE", "SHIP", "LION", "DUCK", "NET", "COIL", "LAMP", "ROOF", "DIVE", "FOOT", "TENT", "RAILS", "FERN", "DAISY", "GATE", "BOMB", "LION"];

    let activeIdx = null, demoInterval = null;

    function init() {
        const grid = document.getElementById('pi-grid');
        piData.forEach((val, i) => {
            const card = document.createElement('div');
            card.className = 'card'; card.id = `card-${i}`;
            card.innerHTML = `
                <div style="font-size:0.6rem;position:absolute;top:3px;left:5px;color:#999;">#${i+1}</div>
                <div class="card-val">${val}</div>
                <div class="major-label" id="label-${i}">${majorWords[i] || ''}</div>`;
            card.onclick = () => handleInput(i);
            grid.appendChild(card);
        });
    }

    function runDemo(type) {
        resetGrid(); window.speechSynthesis.cancel();
        const box = document.getElementById('method-box'); 
        box.style.display = 'block';
        box.innerHTML = `<span class="stop-btn" onclick="resetGrid()">STOP DEMO</span><strong>Mode: ${type.toUpperCase()}</strong> - Running all 52 cards...`;
        
        let i = 0;
        function step() {
            if (i >= 52) { box.innerHTML = "Demo Finished. You just processed 156 digits!"; return; }
            
            const card = document.getElementById(`card-${i}`);
            card.classList.add('revealed', 'active-target');
            if(type === 'major') card.classList.add('major-focus');
            card.scrollIntoView({behavior:'smooth', block:'center'});
            
            let text = piData[i];
            if(type === 'major') text = `Block ${i+1}: ${piData[i].split('').join(' ')}. Major word: ${majorWords[i]}`;
            if(type === 'pao') text = `Card ${i+1}: Image ${i+1} in your mental movie.`;

            const utt = new SpeechSynthesisUtterance(text);
            utt.rate = 1.1;
            utt.onend = () => { i++; updateProgress(i); step(); };
            window.speechSynthesis.speak(utt);
        }
        step();
    }

    function updateProgress(i) {
        const percent = (i / 52) * 100;
        document.getElementById('progress-fill').style.width = percent + "%";
    }

    function handleInput(i) {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active-target'));
        const card = document.getElementById(`card-${i}`);
        card.classList.add('active-target', 'revealed');
        activeIdx = i;
    }

    function resetGrid() {
        window.speechSynthesis.cancel();
        document.querySelectorAll('.card').forEach(c => {
            c.classList.remove('revealed', 'active-target', 'major-focus');
        });
        document.getElementById('method-box').style.display = 'none';
        document.getElementById('progress-fill').style.width = "0%";
    }

    function speakCurrentCard() {
        window.speechSynthesis.cancel();
        if (activeIdx !== null) {
            const utt = new SpeechSynthesisUtterance(piData[activeIdx].split('').join(' '));
            window.speechSynthesis.speak(utt);
        }
    }

    init();
</script>
</body>
</html>
