<div class="dashboard">
    <h1>Asset Monitor & Logistics</h1>
    
    <div class="stat-card">
        <div class="label">Live Gold Spot (USD/oz)</div>
        <div id="gold-price" class="value">Loading...</div>
        
        <div style="margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;">
            <div class="label" style="font-size: 0.7rem;">Set Price Alert ($)</div>
            <input type="number" id="alert-price" placeholder="e.g. 2300" style="width: 100px; margin-bottom: 0;">
            <button class="btn" onclick="saveAlert()" style="width: auto; padding: 5px 15px; font-size: 0.8rem;">SET</button>
            <div id="alert-status" style="font-size: 0.7rem; margin-top: 5px; color: #888;">No alert active</div>
        </div>
    </div>

    <div class="stat-card">
        <div class="label">Warehouse Finder</div>
        <input type="text" id="zip-input" placeholder="Enter Zip Code">
        <button class="btn" onclick="findNearestCostco()">LOCATE STORE</button>
        <div id="nearest-result"></div>
    </div>

    <div class="stat-card">
        <div class="label">Inventory Check</div>
        <button class="btn" style="background:#444; color:white;" onclick="window.open('https://www.costco.com/.product.1768080.html', '_blank')">VIEW GOLD BAR ON COSTCO.COM</button>
    </div>
</div>

<script>
    let globalCostcos = [];
    let targetPrice = null;

    // 1. Load Stores
    async function loadGlobalCostcos() {
        try {
            const response = await fetch('https://raw.githubusercontent.com/get-community/costco-locations/main/costco-locations.json');
            const data = await response.json();
            globalCostcos = data.map(store => ({
                name: `${store.city}, ${store.state || store.country}`,
                lat: parseFloat(store.latitude),
                lng: parseFloat(store.longitude),
                address: `${store.address}, ${store.city}, ${store.state || ''}`
            }));
        } catch (e) { console.error("Data load failed"); }
    }

    // 2. Fetch Price & Check Alert
    async function fetchGoldPrice() {
        try {
            const resp = await fetch('https://api.coinbase.com/v2/prices/XAU-USD/spot');
            const data = await resp.json();
            const currentPrice = parseFloat(data.data.amount);
            
            document.getElementById('gold-price').innerText = `$${currentPrice.toLocaleString()}`;

            // Check if price is below alert threshold
            if (targetPrice && currentPrice <= targetPrice) {
                triggerAlert(currentPrice);
            }
        } catch (e) { document.getElementById('gold-price').innerText = "OFFLINE"; }
    }

    // 3. Price Alert Logic
    function saveAlert() {
        const val = document.getElementById('alert-price').value;
        if (val) {
            targetPrice = parseFloat(val);
            document.getElementById('alert-status').innerText = `Alert active: Below $${targetPrice}`;
            document.getElementById('alert-status').style.color = 'var(--nvidia-green)';
            
            // Request permission for browser notifications
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }
    }

    function triggerAlert(price) {
        if (Notification.permission === "granted") {
            new Notification("💰 Gold Price Alert!", {
                body: `Gold has dropped to $${price}! Check Costco stock now.`,
                icon: "https://www.costco.com/favicon.ico"
            });
        } else {
            alert(`🚨 PRICE ALERT: Gold is now $${price}!`);
        }
        targetPrice = null; // Reset alert after triggering
        document.getElementById('alert-status').innerText = "Alert triggered!";
    }

    // 4. Find Store & Create Maps Link
    async function findNearestCostco() {
        const zip = document.getElementById('zip-input').value;
        const resultDiv = document.getElementById('nearest-result');
        if (!zip) return;

        resultDiv.innerText = "Scanning warehouses...";

        try {
            const response = await fetch(`https://api.zippopotam.us/us/${zip}`);
            const data = await response.json();
            const uLat = parseFloat(data.places[0].latitude);
            const uLng = parseFloat(data.places[0].longitude);

            let closest = null;
            let minDistance = Infinity;

            globalCostcos.forEach(store => {
                const dist = calculateDistance(uLat, uLng, store.lat, store.lng);
                if (dist < minDistance) {
                    minDistance = dist;
                    closest = store;
                }
            });

            // Create Google Maps URL
            const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(closest.address)}`;

            resultDiv.innerHTML = `
                <div style="border-top: 1px solid #333; margin-top:10px; padding-top:10px; text-align: left;">
                    <div style="color:var(--nvidia-green); font-weight:bold;">${closest.name}</div>
                    <div style="color:var(--text-gray); font-size:0.75rem; margin-bottom: 8px;">${closest.address}</div>
                    <div style="font-size:0.8rem; margin-bottom: 10px;">Distance: ${minDistance.toFixed(1)} miles</div>
                    <a href="${mapsUrl}" target="_blank" class="btn" style="display:block; text-align:center; text-decoration:none; padding: 8px; font-size: 0.8rem;">GET DIRECTIONS</a>
                </div>`;
        } catch (e) {
            resultDiv.innerText = "Error finding location.";
        }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 3958.8;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    fetchGoldPrice();
    loadGlobalCostcos();
    setInterval(fetchGoldPrice, 30000); // Check price every 30 seconds
</script>
