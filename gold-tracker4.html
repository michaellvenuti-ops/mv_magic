<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costco Asset Monitor | NV-Series</title>
    <style>
        :root { 
            --nv-green: #76b900; 
            --bg-black: #000000; 
            --card-gray: #1a1a1a; 
            --accent-gray: #333333;
            --text-dim: #b3b3b3; 
        }

        body { 
            background-color: var(--bg-black); 
            color: white; 
            font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            padding: 20px;
        }

        .dashboard { 
            width: 100%; 
            max-width: 450px; 
            background: var(--card-gray); 
            padding: 25px; 
            border-radius: 16px; 
            border-top: 5px solid var(--nv-green);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        h1 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; color: var(--nv-green); margin-bottom: 25px; text-align: center; }

        .stat-card { 
            background: #222; 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            border: 1px solid var(--accent-gray);
        }

        .label { color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }

        .value { font-size: 2rem; font-weight: 800; color: var(--nv-green); }

        input { 
            background: #000; border: 1px solid var(--accent-gray); color: white; 
            padding: 12px; border-radius: 6px; width: calc(100% - 26px); 
            margin-bottom: 10px; font-size: 1rem; outline: none;
        }

        input:focus { border-color: var(--nv-green); }

        .btn { 
            background: var(--nv-green); color: black; border: none; 
            padding: 14px; border-radius: 6px; font-weight: 700; 
            cursor: pointer; width: 100%; transition: 0.3s;
            text-transform: uppercase; font-size: 0.85rem;
        }

        .btn:hover { background: #89d400; transform: translateY(-1px); }

        .btn-secondary { background: transparent; border: 1px solid var(--nv-green); color: var(--nv-green); margin-top: 10px; }

        #nearest-result { margin-top: 15px; border-top: 1px solid var(--accent-gray); padding-top: 15px; display: none; }

        .maps-link { 
            display: block; background: #333; color: white; text-decoration: none; 
            text-align: center; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <h1>Asset Monitor System</h1>
    
    <div class="stat-card">
        <div class="label">Live Gold Spot (USD)</div>
        <div id="gold-price" class="value">---.--</div>
        <div id="alert-status" style="font-size: 0.7rem; color: #666; margin-top: 5px;">Price updates every 30s</div>
    </div>

    <div class="stat-card">
        <div class="label">Warehouse Logistics</div>
        <input type="text" id="zip-input" placeholder="Enter Zip Code">
        <button class="btn" onclick="findNearestCostco()">Analyze Nearest Store</button>
        
        <div id="nearest-result">
            <div id="store-name" style="color:var(--nv-green); font-weight:bold; font-size: 1.1rem;"></div>
            <div id="store-address" style="color:var(--text-dim); font-size:0.8rem; margin: 5px 0;"></div>
            <div id="store-dist" style="font-size:0.85rem; margin-bottom: 10px;"></div>
            <a id="maps-btn" href="#" target="_blank" class="maps-link">OPEN IN GOOGLE MAPS</a>
        </div>
    </div>

    <button class="btn btn-secondary" onclick="window.open('https://www.costco.com/.product.1768080.html', '_blank')">Verify Item #1768080</button>
</div>

<script>
    let globalCostcos = [];

    // Load Price
    async function fetchGoldPrice() {
        try {
            const resp = await fetch('https://api.coinbase.com/v2/prices/XAU-USD/spot');
            const data = await resp.json();
            document.getElementById('gold-price').innerText = `$${parseFloat(data.data.amount).toLocaleString()}`;
        } catch (e) { document.getElementById('gold-price').innerText = "OFFLINE"; }
    }

    // Load Stores from an alternative reliable CSV-to-JSON mirror
    async function loadStores() {
        try {
            // Using a mirror of the official warehouse list
            const response = await fetch('https://raw.githubusercontent.com/ghandic/costco-warehouses/master/costco_warehouses.json');
            globalCostcos = await response.json();
            console.log("System Ready: Locations Encoded.");
        } catch (e) { console.error("Data failure"); }
    }

    // Main Locator Logic
    async function findNearestCostco() {
        const zip = document.getElementById('zip-input').value;
        if (!zip) return;

        // Save Zip for next time
        localStorage.setItem('savedZip', zip);

        try {
            const response = await fetch(`https://api.zippopotam.us/us/${zip}`);
            const data = await response.json();
            const uLat = parseFloat(data.places[0].latitude);
            const uLng = parseFloat(data.places[0].longitude);

            let closest = null;
            let minDistance = Infinity;

            globalCostcos.forEach(store => {
                const sLat = parseFloat(store.latitude);
                const sLng = parseFloat(store.longitude);
                const dist = calculateDistance(uLat, uLng, sLat, sLng);
                if (dist < minDistance) {
                    minDistance = dist;
                    closest = store;
                }
            });

            // Update UI
            document.getElementById('nearest-result').style.display = 'block';
            document.getElementById('store-name').innerText = `Costco ${closest.city}`;
            document.getElementById('store-address').innerText = `${closest.address}, ${closest.city}, ${closest.state}`;
            document.getElementById('store-dist').innerText = `${minDistance.toFixed(1)} miles away`;
            document.getElementById('maps-btn').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(closest.address + ' ' + closest.city)}`;

        } catch (e) { alert("Invalid Zip Code"); }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 3958.8;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // Auto-fill saved zip
    const saved = localStorage.getItem('savedZip');
    if (saved) {
        document.getElementById('zip-input').value = saved;
    }

    fetchGoldPrice();
    loadStores();
    setInterval(fetchGoldPrice, 30000);
</script>

</body>
</html>
